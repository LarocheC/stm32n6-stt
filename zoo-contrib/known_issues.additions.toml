[[issue]]
id            = "signing-without-align-unbootable-image"
failure_class = "SILENT_UNBOOTABLE_SIGNED_IMAGE"
stage         = "board"
zoo_action    = "board-invariant"
title         = """
    SILENT: signing without `-align` computes the wrong entry point and the
    board is completely dead with byte-perfect flash
    """
symptom       = """
    No output at all, at any baud, in either boot-switch position, after a
    power cycle or a reset. Every step reports success: the build links, the
    signing tool exits 0, all three flash writes print `File download
    complete`, and a read-back from the board matches the signed binary
    byte-for-byte (both 0x70000000 and 0x70100000 begin `53544d32`, `STM3`).
    Indistinguishable from a dead board, a wrong baud, a bad clock config or a
    hang in early init - all of which were eliminated one by one first, at the
    cost of most of a day and several boot-switch round trips.
    """
cause         = """
    `STM32_SigningTool_CLI --align` pads the payload to a 0x400 offset. Without
    it the payload starts at the wrong offset and the header's COMPUTED entry
    point at +0x70 is wrong by exactly that confusion. Measured on one
    identical .bin signed four ways: ST's Makefile flags (`-s -bin -nk -t ssbl
    -hv 2.3`) give entry 0x34002F79; adding `-align` gives 0x340167BD, which is
    Reset_Handler and the ELF entry point. 0x34002F79 is in the middle of
    .text (0x34000750-0x3401ACC8), so the FSBL jumps into the interior of a
    function and the part dies before UART init. The code was never broken:
    under the documented dev-mode gdb workflow the same image reaches
    MPU_Config -> Int_Mem_Config -> Ext_Mem_Config -> NPU_Config -> IAC_Config
    -> UART_Config in order and runs. `-align` is mandatory on CubeProgrammer
    2.21+ (this bench runs 2.22.0) and ST's own `bm.mk:39` does not pass it.
    """
workaround    = """
    Sign with `-align`:
        STM32_SigningTool_CLI -s -bin app.bin -nk -t ssbl -hv 2.3 -align -o app_sign.bin
    Then VERIFY BEFORE FLASHING - the word at +0x70 of the signed image must
    equal Reset_Handler from `nm`. Two commands, and they catch a silently
    unbootable image before it costs a boot-switch round trip:
        test "$(xxd -e -g4 -s 0x70 -l 4 app_sign.bin | awk '{print $2}')" \\
           = "$(arm-none-eabi-nm app.elf | awk '/ Reset_Handler/{print $1}' \\
                | sed 's/^0*//' | awk '{printf "%x\\n", strtonum("0x"$1)+1}')" \\
          && echo "entry point OK"
    `-ep <addr>` also works and `-align -ep -la` works; plain ST flags do not.
    NOTE the near miss: `config/toolchain.toml` already carried the knowledge
    ("2.21 introduced the mandatory -align on signing"). The note existed and
    was simply never connected to a symptom that looks like a dead board, which
    is the argument for keeping this catalogue keyed on SYMPTOMS.
    """
silent        = true
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/stm32n6-tts/board/GATE3.md", "/home/claroche/stm32n6-deployment-zoo/config/toolchain.toml"]

[[issue]]
id            = "st-makefile-passes-fcyclomatic-complexity"
failure_class = "VENDOR_ONLY_COMPILER_FLAG"
stage         = "board"
zoo_action    = "board-invariant"
title         = """
    ST's Makefile passes `-fcyclomatic-complexity`, which is not an upstream
    GCC option, so the ST-validated Arm GNU 13.3 cannot build ST's own example
    """
error_signature = "unrecognized command-line option '-fcyclomatic-complexity'"
symptom       = """
    Building STM32N6-GettingStarted-Audio with the toolchain the zoo pins -
    arm-gnu-toolchain-13.3.rel1, the version ST document as validated for
    Cortex-M55 - fails immediately:
        arm-none-eabi-gcc: error: unrecognized command-line option '-fcyclomatic-complexity'
    The error names a flag, which sends the reader looking for where the flag
    came from rather than for which compiler is missing.
    """
cause         = """
    `-fcyclomatic-complexity` is an ST addition, present only in the
    "GNU Tools for STM32" compiler shipped inside STM32CubeCLT / STM32CubeIDE,
    and `Projects/GS/Makefile:225-226` passes it unconditionally in C_FLAGS.
    The validated toolchain version and the toolchain that can build ST's own
    examples are not the same toolchain.
    """
workaround    = """
    Build with ST's compiler:
        make bm -j8 GCC_PATH=<stm32cubeclt>/GNU-tools-for-STM32/bin
    (GNU Tools for STM32 14.3.rel1 accepts the flag and builds clean.) A shim
    that strips the flag also works with vanilla Arm GNU 13.3 and produces a
    working image - both lineages were flashed and both ran, so this is a build
    blocker, not a correctness one. Do NOT reach for `OPT=` on the command line
    to remove it; see `make-command-line-opt-override-discards-appends`.
    """
silent        = false
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/stm32n6-tts/board/GATE3.md", "/home/claroche/stm32n6-tts/vendor/STM32N6-GettingStarted-Audio/Projects/GS/Makefile"]

[[issue]]
id            = "make-command-line-opt-override-discards-appends"
failure_class = "BUILD_FLAGS_SILENTLY_DROPPED"
stage         = "board"
zoo_action    = "board-invariant"
title         = """
    Overriding `OPT` on the make command line discards every `OPT +=` in ST's
    Makefile, and the resulting error names a CMSIS-DSP vector type
    """
error_signature = "incompatible types when initializing type 'uint16x8_t' using type 'int16x8_t'"
symptom       = """
    Adding a define or an include path the obvious way - `make bm OPT="..."` -
    breaks the build somewhere that has nothing to do with the change:
        .../StatisticsFunctions/arm_absmax_no_idx_q15.c:59:37: error:
          incompatible types when initializing type 'uint16x8_t' using type 'int16x8_t'
              uint16x8_t curExtremValVec = vdupq_n_s16(Q15_ABSMIN);
    and similarly for q31/q7 in arm_absmax/absmin_no_idx. Nothing mentions the
    override. Reproduced by re-running one recorded compile line with the flag
    removed: the first file to fail is
    Drivers/CMSIS/DSP/Source/StatisticsFunctions/StatisticsFunctions.c.
    """
cause         = """
    A variable set on the make command line overrides every assignment in the
    makefile, INCLUDING `+=`, unless the makefile marks it `override`. ST's
    Makefile builds its flags as `OPT = -g3 -Os` (line 5) followed by
    `OPT += ...` (lines 225-227), so an override silently deletes
    `-flax-vector-conversions` - which CMSIS-DSP's MVE paths need, because they
    initialise unsigned vector types from signed `vdupq_n_*` intrinsics - along
    with `-Wall -fstack-usage -fdata-sections -ffunction-sections
    --specs=nano.specs` and the `-MMD -MP` dependency generation.
    """
workaround    = """
    Never set OPT on the command line for this package. Add an extension point
    instead - one line after the last append:
        OPT += $(EXTRA_CFLAGS)
    and pass `EXTRA_CFLAGS="-DFOO -I/path"`. The dropped section flags are the
    part to worry about beyond the loud failure: a build that happens not to
    touch CMSIS-DSP loses -fdata-sections/-ffunction-sections and grows,
    which on this part is measured against a hard 512 KiB application slot
    (see `app-slot-512k-overflow-into-weights`).
    """
silent        = false
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/stm32n6-tts/firmware/apply_vendor_mods.sh", "/home/claroche/stm32n6-tts/vendor/STM32N6-GettingStarted-Audio/Projects/GS/Makefile"]

[[issue]]
id            = "ai-dpu-model-check-rejects-int8-rank3-output"
failure_class = "APP_MODEL_CHECK_REJECTS_VALID_OUTPUT"
stage         = "runtime"
zoo_action    = "board-invariant"
title         = """
    `ai_dpu.c`'s model check rejects int8 rank-3 outputs into Error_Handler()
    and a hang; it passes ST's own models only because those are float32
    """
error_signature = "AI_DPU: Output format not supported"
symptom       = """
    The application prints its banner, then stops for good. The last line is
    `AI_DPU: Output format not supported`, followed by `AI_DPU: Check model
    Failed`, after which `AiDPULoadModel()` calls `Error_Handler()`, which is
    `__disable_irq(); while(1);`. Nothing else ever prints and no fault is
    raised, so it reads as a startup hang rather than as a rejected model.
    (Signature transcribed from the source literal at `Projects/Dpu/
    ai_dpu.c:109`, reached via `LogError` at LOG_ERROR, which the package's
    default LOG_LEVEL=LOG_INFO does print - `Projects/Common/logging.c`,
    `LogLevel <= LOG_LEVEL`. It was predicted from the source and patched
    before flashing, so this exact line has not been read off a UART here.)
    """
cause         = """
    `AiDPUCheckModel()`, `Projects/Dpu/ai_dpu.c:99-107`:
        if (STAI_FORMAT_FLOAT32 != pxInfo->outputs[i].format &&
            2 != pxInfo->outputs[i].shape.size)
    `stai_shape` is a `stai_array_s32`, so `.size` is the RANK, not a byte
    count. A CTC head is `STAI_FORMAT_S8` at rank 3 - {100, 1025, 1} here - so
    both conjuncts hold and the model is rejected. ST's own AED and SE models
    survive the check only because their outputs are float32. The INPUT check
    at :88-98 is fine: it short-circuits on STAI_FORMAT_S8.
    """
workaround    = """
    Add the format to the disjunction:
        if (STAI_FORMAT_FLOAT32 != pxInfo->outputs[i].format &&
            STAI_FORMAT_S8      != pxInfo->outputs[i].format &&
            2 != pxInfo->outputs[i].shape.size)
    Also note that `AiDPULoadModel()` indexes `shape.data[AI_DPU_WIDTH=1]` and
    `[AI_DPU_HEIGHT=2]` into in_width/in_height/out_height, which on a rank-3
    tensor yields meaningless values (in_width=800, in_height=1,
    out_height=1025). Harmless as long as nothing downstream reads them, which
    stops being true if `printInferenceResults` is kept.
    """
silent        = false
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/stm32n6-tts/firmware/WORKLIST.md", "/home/claroche/stm32n6-tts/firmware/apply_vendor_mods.sh", "/home/claroche/stm32n6-tts/vendor/STM32N6-GettingStarted-Audio/Projects/Dpu/ai_dpu.c"]

[[issue]]
id            = "app-slot-512k-overflow-into-weights"
failure_class = "FLASH_SLOT_OVERFLOW_OVERWRITES_WEIGHTS"
stage         = "board"
zoo_action    = "board-invariant"
title         = """
    SILENT: the application slot between 0x70100000 and the weight base is
    512 KiB, and a large generated `network.c` overflows it into the weights
    """
symptom       = """
    The build succeeds and the flash writes succeed. ST's layout puts the
    signed application at 0x70100000 and the weight blob at 0x70180000, which
    leaves the application exactly 524,288 B. Stock (ST's Yamnet-1024 AED
    model) is 244,544 B and nothing complains. Citrinet-256 at T=800 produces a
    9,967,286 B `network.c` against the AED model's 810,318 B; its object file
    alone is 520,957 B of read-only image (437,705 B .rodata of epoch and
    descriptor tables, 83,252 B .text), and the linked binary is 714,432 B -
    190,144 B past the slot. Flashing it would write the tail of .text over the
    start of the weight blob, after which the network reads garbage while every
    log looks clean. (Caught here by comparing the binary size to the slot; the
    corrupted-weights run was never performed.)
    """
cause         = """
    Nothing in the toolchain knows about the slot. It is the distance between
    two addresses chosen in two different scripts - the app base in
    `sign-and-flash-model.sh` and the `--change-addresses 0x70180000` in
    `generate-n6-model.sh` - and the linker script describes RAM, not this. A
    model's contribution to image size is its epoch table, which scales with
    epoch count rather than with weights or MACs, so a small model with many
    epochs is the dangerous shape.
    """
workaround    = """
    Move the weight base. 0x70400000 gives the application 3 MB and costs
    nothing: recompiled there, Citrinet-256 is still 628 epochs, still 0 SW and
    0 hybrid, still 625.000 kB of activations in cpuRAM2 + npuRAM6, only the
    octoFlash range moves (0x70400000-0x70DBA700). Change it in BOTH places -
    the mpool's octoFlash offset and the objcopy `--change-addresses` - or the
    blob and the compiled base disagree silently. Then add
    `arm-none-eabi-size` against the slot to the build script and fail loudly.
    """
silent        = true
is_infra      = true
detectable_statically = false
sources       = ["/home/claroche/stm32n6-tts/firmware/WORKLIST.md", "/home/claroche/stm32n6-tts/compile/reports/g800_stt_0x70400000/summary.txt", "/home/claroche/stm32n6-tts/compile/stt_audio.mpool"]


