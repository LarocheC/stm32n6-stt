[[issue]]
id            = "psram-spill-with-zero-sw-epochs"
failure_class = "SILENT_ACTIVATION_SPILL_TO_PSRAM"
stage         = "compile"
zoo_action    = "compile-postcondition"
title         = """
    SILENT: a compile can move activations to PSRAM while still reporting 0 SW
    and 0 hybrid epochs, and its cycle total goes DOWN
    """
symptom       = """
    The compile succeeds and every headline number looks right. Citrinet-256 at
    a 12 s window (T=1200), on ST's audio-application mpool with ST's own
    option string, reports `Total number of epochs 618`, `>> pure software (SW)
    epochs 0`, `>> hybrid epochs 0` - and puts 150.000 kB of activations in
    hyperRAM at 0x90000000-0x90025800. The epoch table cannot show it because a
    spilled buffer is not a software epoch. Worse, the scheduler's own cycle
    total does not show it either: the spilled build reports 123,775,024 cycles
    against 124,080,680 for the fully on-chip build, so the spill reads as very
    slightly FASTER. Measured traffic on the spilled buffer: 153,600 B read +
    153,600 B written, 1,152,000 modelled cycles.
    """
cause         = """
    The allocator spills to whatever external memory the mpool offers it, and
    ST's audio mpool offers 16 MB of hyperRAM (xSPI1). Two numbers a reader
    naturally treats as the health check - the epoch mapping table and the
    predicted cycle count - are both blind to placement. The cycle model does
    not price PSRAM pressure, and epochs are about which engine runs an op, not
    about which pool its buffers landed in.
    """
workaround    = """
    Gate on the per-pool placement line, not on the epoch table and not on the
    cycle total: assert `hyperRAM ... 0 B` and the expected flash base in
    `network_generate_report.txt`, both single greps. Two independent
    cross-checks exist for a clean run: `st_ai_ws/neural_art__network/
    atonbuf.xSPI1.raw` is 0 bytes, and every `hyperRAM (r/w/cycles)` column of
    the `--csv-file` output sums to 0. On this graph `--Oauto-sched` removes
    the spill outright (600.000 kB cpuRAM2 + 417.188 kB npuRAM6, 0 B hyperRAM,
    628 epochs, 0 SW) - ST's audio application ships WITHOUT that flag, so the
    option set a firmware integration inherits is the one that spills.
    """
silent        = true
is_infra      = false
detectable_statically = false
sources       = ["/home/claroche/stm32n6-tts/compile/GATE2.md", "/home/claroche/stm32n6-tts/compile/reports/g1200_st/summary.txt", "/home/claroche/stm32n6-tts/compile/DECISION-oauto-sched.md"]


