[[amend]]
replaces = "ll-aton-middleware-version-mismatch"
reason   = """
    The existing entry gets the severity and the remedy wrong, and the remedy
    being wrong is the expensive part.

    It says `make build` WARNS. It does not warn: generated `network.c` opens
    with a preprocessor guard and `#error`, so the build stops.

    It says to "keep generator and app on the same major/minor (4.0.x was
    accepted here)". That is not what the guard tests. Verified verbatim at
    `artifacts/model_c/network.c:56-58`:

        #if LL_ATON_VERSION_MAJOR != 1 || LL_ATON_VERSION_MINOR != 1 ||
            LL_ATON_VERSION_MICRO != 3 || LL_ATON_VERSION_DEV != 275
        #  error "Possible mismatch in ll_aton library used"

    All four components, DEV included, must be equal. The mismatch hit here is
    `atonn-v1.1.3-262-g7cc65410` (what STM32N6-GettingStarted-Audio vendors, at
    Middlewares/ST/AI/Npu/ll_aton/ll_aton_version.h:22-26) against
    `atonn-v1.1.3-275-g6770925d` (what ST Edge AI Core 4.0.1-20581 generates
    against) — the SAME major, minor and micro, and it still fails. Anyone
    following the current workaround would confirm 1.1.3 == 1.1.3 and go
    looking somewhere else.

    Keeping the id and the error signature; replacing severity, cause, remedy
    and zoo_action, and adding this project as a second source.
    """

  [amend.issue]
  id            = "ll-aton-middleware-version-mismatch"
  failure_class = "STALE_RUNTIME_MIDDLEWARE"
  stage         = "board"
  zoo_action    = "board-invariant"          # was "document-only"
  title         = """
      INFRA: the app's bundled ll_aton middleware is version-locked to the exact
      stedgeai build that generated network.c, down to the dev number
      """
  error_signature = "Possible mismatch in ll_aton library used"
  symptom       = """
      The FIRMWARE BUILD FAILS - it does not warn - on the generated model
      source:
          network.c:57:4: error: #error "Possible mismatch in ll_aton library used"
      Dropping a model generated by a newer ST Edge AI Core into an application
      package that vendors an older runtime cannot work, and matching the
      major/minor is not enough to satisfy it.
      """
  cause         = """
      `network.c` guards on all four version components with `!=`, so
      LL_ATON_VERSION_DEV must be equal too. Measured here: the package ships
      atonn-v1.1.3-262-g7cc65410, ST Edge AI Core 4.0.1-20581 generates against
      atonn-v1.1.3-275-g6770925d. Same 1.1.3, different dev, hard error. ST
      versions the application package and the compiler independently and ships
      them mismatched.
      """
  workaround    = """
      Move the APPLICATION onto the compiler's runtime, not the other way
      round: copy Inc/Lib/Misc/Npu/Reloc/SystemPerformance from
      `<stedgeai>/Middlewares/ST/AI` over the package's `Middlewares/ST/AI`,
      and follow the runtime-library rename in the Makefile
      (NetworkRuntime1200_CM55_GCC.a -> NetworkRuntime1201_CM55_GCC.a).
      Downgrading the compiler instead invalidates every compile-stage number
      already recorded against the model. Two knock-on effects, both hit here:
      the newer headers stop pulling in `assert.h` transitively, and GCC 14
      makes an implicit function declaration an error, so
      `Projects/Common/cpu_stats.c` needs an explicit `#include <assert.h>`.
      Check the version pair BEFORE generating - one grep of
      `Middlewares/ST/AI/Npu/ll_aton/ll_aton_version.h` against the toolchain's
      copy - because the alternative is discovering it after a compile.
      """
  silent        = false
  is_infra      = true
  detectable_statically = false
  sources       = ["/home/claroche/eco8-neaixt/deploy/stm32n6/README.md", "/home/claroche/stm32n6-tts/firmware/apply_vendor_mods.sh", "/home/claroche/stm32n6-tts/artifacts/model_c/network.c"]


[[amend]]
replaces = "no-stm32-target-found-on-swd"
reason   = """
    Only the `workaround` field changes. This project reproduced the same
    error text from a different cause - the boot configuration is latched at
    reset, so `mode=HOTPLUG` cannot attach once the board has been booted from
    flash, in EITHER switch position - and the existing remedy (press RESET)
    does not fix that one. Since `classify()` will route the text here, this is
    where the second remedy has to live. Everything else about the entry stands.
    """
  [amend.issue]
  workaround = """
      Press the black RESET button on the DK and retry. If that does not help
      and the board has ever been booted from flash, use `mode=UR` instead of
      `mode=HOTPLUG`: the boot configuration is latched at reset, HOTPLUG
      attaches to a running target and never asserts NRST, and mode=UR
      (connect under reset) catches the part early. See
      `hotplug-fails-after-first-boot-from-flash` for the measured access
      matrix - notably that erasing external flash needs the development switch
      position while reading it does not.
      """
