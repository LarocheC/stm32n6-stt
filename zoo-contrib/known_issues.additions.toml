# Additions to zoo/faults/known_issues.toml — eight constraints hit and
# verified while putting Citrinet-256 on an STM32N6570-DK (~/stm32n6-tts).
#
# SEVEN of them are new `[[issue]]` blocks. The eighth — the ll_aton version
# lock — is already in the catalogue and is WRONG, so it arrives as an
# `[[amend]]` block instead: same id, corrected fields, with the correction
# spelled out. A second `[[amend]]` extends an existing infra entry whose
# error signature this project's failure also matches.
#
# `[[amend]]` is not a schema the loader knows; `known_issues()` reads only
# `issue`, so a blind `cat >>` of this file is SAFE but INCOMPLETE — it adds
# the seven and silently ignores the two corrections. Apply the amendments by
# hand. Order and placement: insert each block into the section named above it,
# because the file is ordered by what a reader can do about an entry — lint
# rules first (a static screen predicts them), then graph patches, compile
# post-conditions, board invariants, infra retries, and finally the ones there
# is nothing to do about but know.
#
# Four carry a verbatim `error_signature` and are therefore live code —
# `zoo.faults.signatures.classify` matches them, case-insensitively and
# whitespace-insensitively, as a substring of tool output. Three sit on new
# entries; the fourth is the one already on the amended ll_aton entry. Three of
# the four were read off a terminal in this project and the fourth is
# transcribed from the source literal that emits it, marked as such. Nothing
# here is a guess, and nothing here introduces a signature that collides with
# one already in the file — which is why the `mode=HOTPLUG` entry deliberately
# carries none.
#
# Three of the seven are SILENT: the tool reports success, or reports nothing
# at all, and the result is wrong. That is the failure class this catalogue
# exists for, and the signing one below is the most expensive instance either
# project has recorded — a completely dead board with byte-perfect flash.
#
# Counts after applying this file: 82 -> 89 constraints, 30 -> 33 carrying a
# verbatim signature, 32 -> 35 silent. Those three numbers are quoted in the
# zoo's README.md under "The failure atlas" and want updating with it.


